<!doctype html>
<!-- Inline background: the page must be dark from the very first paint,
     before the CSS bundle arrives (avoids a white flash on cold loads). -->
<html lang="en" style="background: #05070d">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Espilce — a 3D eclipse viewer driven by real ephemeris data. Scrub 150 years of solar and lunar eclipses and see exactly which towns fall in the shadow." />
    <meta name="theme-color" content="#05070d" />
    <title>Espilce — 3D Eclipse Viewer</title>

    <!-- Link previews (Open Graph / Twitter). Image spec: 1200x630 (1.91:1),
         replace public/og.jpg to change it. URLs must stay ABSOLUTE, and bump
         the ?v= query on every image change — social scrapers cache the
         unfurl by URL for days. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Espilce" />
    <meta property="og:url" content="https://larprad.github.io/espilce/" />
    <meta property="og:title" content="Espilce — 3D Eclipse Viewer" />
    <meta property="og:description" content="Scrub 150 years of real solar and lunar eclipses in 3D. Watch the Moon's shadow sweep the Earth, city by city." />
    <meta property="og:image" content="https://larprad.github.io/espilce/og.jpg?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Moon's shadow sweeping across Earth during the 12 August 2026 total solar eclipse, rendered in Espilce" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Espilce — 3D Eclipse Viewer" />
    <meta name="twitter:description" content="Scrub 150 years of real solar and lunar eclipses in 3D. Watch the Moon's shadow sweep the Earth, city by city." />
    <meta name="twitter:image" content="https://larprad.github.io/espilce/og.jpg?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
